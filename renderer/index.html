<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <!-- Ровно то, что окну нужно, и ничего сверх: рендерер не делает ни одного
       сетевого вызова, только IPC, а он под CSP не подпадает. Единственный
       внешний хост — гербы FotMob. `unsafe-inline` для стилей нужен: цвет
       турнира ставится инлайновым свойством. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src https://images.fotmob.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>IPTV Матч-центр</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="guide">
    <header class="head">
      <div class="brand">
        <!-- Сигнальная лампа эфира: единственное украшение в интерфейсе. -->
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>IPTV<br />Матч-центр</h1>
      </div>
      <div class="head-actions">
        <button id="openSettings" class="btn ghost">Настройки</button>
        <button id="sync" class="btn">Обновить</button>
      </div>
    </header>

    <div class="status" id="status" role="status">Загружаю сохранённую сетку…</div>

    <div class="update-banner" id="updateBanner" hidden>
      <span id="updateBannerText"></span>
      <button id="updateInstall" class="btn ghost" type="button">Перезапустить</button>
    </div>

    <nav class="filters" id="filters" aria-label="Фильтр">
      <button class="filter" data-filter="all" aria-pressed="true">Все</button>
      <button class="filter" data-filter="live" aria-pressed="false">Сейчас</button>
      <button class="filter" data-filter="upcoming" aria-pressed="false">Предстоящие</button>
    </nav>

    <div class="legend">
      <span><i class="l-confirmed"></i>EPG + FotMob</span>
      <span><i class="l-epg"></i>только EPG</span>
      <span><i class="l-fotmob"></i>только FotMob</span>
    </div>

    <div class="list" id="list"></div>

    <div class="diag" id="diag" hidden></div>
  </aside>

  <dialog id="settingsDialog">
    <h2>Настройки</h2>

    <label class="field">
      <span>Плейлист — файл или ссылка</span>
      <div class="row">
        <input id="playlistInput" type="text" placeholder="http://… или C:\…\playlist.m3u8" />
        <button id="browsePlaylist" class="btn ghost" type="button">Обзор…</button>
      </div>
    </label>

    <label class="field">
      <span>EPG — ссылка на XMLTV (необязательно)</span>
      <input id="epgInput" type="text" placeholder="по умолчанию берётся url-tvg из плейлиста" />
    </label>

    <label class="field">
      <span>Путь к VLC (необязательно)</span>
      <div class="row">
        <input id="vlcPathInput" type="text" placeholder="по умолчанию ищется в Program Files" />
        <button id="browseVlcPath" class="btn ghost" type="button">Обзор…</button>
      </div>
    </label>

    <div class="field">
      <span>Турниры</span>
      <div class="competitions" id="competitionsList"></div>
    </div>

    <p class="dialog-error" id="settingsError" hidden></p>

    <div class="dialog-actions">
      <button id="settingsCancel" class="btn ghost" type="button">Отмена</button>
      <button id="settingsSave" class="btn" type="button">Сохранить</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
